<style>
:root{
  --ink:#F7F8FA; --line:#DFE4EA; --fg:#0B0C0E; --mute:#5C646D; --faint:#8A929B; --accent:#1B6DB4;
  --mono: ui-monospace,"SF Mono",SFMono-Regular,"JetBrains Mono",Menlo,Consolas,monospace;
  --sans: system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;}
body{margin:0;background:#fff;font-family:var(--sans);-webkit-font-smoothing:antialiased;}
.og{
  width:1200px; height:630px; background:var(--ink); display:flex; align-items:center;
  gap:64px; padding:0 84px; overflow:hidden;
}
.left{ flex:0 0 430px; }
#globe{ display:block; width:100%; height:auto; overflow:visible; }
#globe .grat{ fill:none; stroke:var(--accent); stroke-width:.75; opacity:.2; stroke-linecap:round; }
#globe .limb{ fill:none; stroke:var(--accent); stroke-width:.9; opacity:.4; stroke-linecap:round; }
#globe .limb2{ fill:none; stroke:var(--accent); stroke-width:.7; opacity:.2; stroke-linecap:round; }
#globe .coast{ fill:none; stroke:var(--accent); stroke-width:1.35; opacity:.85; stroke-linecap:round; stroke-linejoin:round; }
#globe .coast-ghost{ fill:none; stroke:var(--accent); stroke-width:1.1; opacity:.26; stroke-linecap:round; stroke-linejoin:round; }
#globe .track{ fill:none; stroke:var(--accent); stroke-width:.85; opacity:.28; stroke-dasharray:1.5 4; stroke-linecap:round; }
#globe .trail{ fill:none; stroke:var(--fg); stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }
#globe .trail-past{ fill:none; stroke:var(--fg); stroke-width:1.4; opacity:.34; stroke-linecap:round; stroke-linejoin:round; }
#globe .visited{ fill:var(--accent); opacity:.5; }
#globe .pin{ fill:none; stroke:var(--fg); stroke-width:1.2; opacity:.7; }
#globe .pin-live{ fill:var(--fg); stroke:var(--fg); opacity:1; }
#globe .plane{ fill:var(--fg); }
#globe .city{ font-family:var(--mono); font-size:7.5px; letter-spacing:.15em; fill:var(--fg); }
#globe .city-sub{ font-family:var(--mono); font-size:6.5px; letter-spacing:.12em; fill:var(--mute); }
.right{ flex:1 1 auto; min-width:0; }
.mark{ font-family:var(--mono); font-size:82px; font-weight:500; letter-spacing:-.055em; line-height:1; color:var(--fg); }
.mark .four{ color:var(--accent); }
.ul{ display:block; width:260px; height:20px; margin:6px 0 26px -4px; overflow:visible; }
.ul path{ fill:none; stroke:var(--accent); stroke-width:2.4; stroke-linecap:round; }
.name{ font-size:31px; font-weight:600; letter-spacing:-.02em; color:var(--fg); margin-bottom:16px; }
.blurb{ font-size:19px; line-height:1.55; color:var(--mute); max-width:520px; }
.blurb b{ color:var(--fg); font-weight:600; }
.foot{ margin-top:34px; font-family:var(--mono); font-size:13px; letter-spacing:.16em; text-transform:uppercase; color:var(--faint); }
